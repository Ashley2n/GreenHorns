<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        h1 {
            text-align: center;
            font-family: Verdana, sans-serif;
            font-size: 50px;
            color: white;
            background-color: orange;
            -webkit-text-stroke-width: 2px;
            -webkit-text-stroke-color: black;
        }

        body {
            color: white;
            font-family: Verdana, sans-serif;
            background-color: #75a4fc;
            background-image: radial-gradient(brown 10%, transparent 10%);
            background-size: 50px 50px;
            text-align: center;
            font-size: 30px
        }

        .circle {
            width: 300px;
            height: 300px;
            background-color: white;
            border-radius: 50%;
            cursor: pointer;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        button {
            color: white;
            font-size: 30px;
            font-family: Arial, sans-serif;
            background-color: orange;
            cursor: pointer;
            margin-left: 0px;
        }

        button:hover {
            background-color: lightgrey;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            position: absolute;
            top: 78%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

    </style>

    <button>HOME</button>  <!-- Add a function that sends you back to the title screen page -->

</head>
<body>
    <h1>Profile</h1>

    <div class="circle"></div> <!-- The circle will be where the user can upload
                                their avatar inside, so make sure to add something
                                that lets the user do that -->

    <label>Username: </label> <!--Make it so that the username that the user created,
                                appears in front of the username label-->

    <label>Level: </label> <!--Shows the level the user is at-->

    <p>Change OR Add avatar inside the circle</p>

</body>
</html>
